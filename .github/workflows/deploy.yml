name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
    # Stress (concurrency) and integration tests build on tests/integration/setup.ts,
    # which requires the tradeupbot_test PostgreSQL database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tradeupbot
          POSTGRES_PASSWORD: tradeupbot_pg_2026
          POSTGRES_DB: tradeupbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://tradeupbot:tradeupbot_pg_2026@localhost:5432/tradeupbot_test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Determine whether deployment is needed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          deploy=true
          if [[ "$EVENT_NAME" == "push" && -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            # Compare the full push, including every commit and both sides of renames.
            git diff --name-only --no-renames -z "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/deploy-paths"
            deploy=false
            while IFS= read -r -d '' changed_path; do
              if [[ "$changed_path" != "README.md" ]]; then
                deploy=true
                break
              fi
            done < "$RUNNER_TEMP/deploy-paths"
          fi
          printf 'deploy=%s\n' "$deploy" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build (required for unit tests that read dist/)
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Stress / perf budgets
        run: npm run test:stress

  deploy:
    needs: test
    if: needs.test.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Install frontend deps
        run: cd frontend && npm ci
        if: hashFiles('frontend/package-lock.json') != ''

      - name: Build (Vite + prerender)
        run: npm run build

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 178.156.239.58 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync dist to VPS
        run: rsync -avz --delete dist/ root@178.156.239.58:/opt/trade-up-bot/dist/

      - name: Git pull main + pm2 reload api
        run: |
          ssh root@178.156.239.58 "cd /opt/trade-up-bot && git fetch origin main && git merge --ff-only origin/main && pm2 reload api"

      - name: Smoke check
        run: |
          sleep 8
          HTTP=$(curl -s -o /tmp/home.html -w "%{http_code}" https://tradeupbot.app/)
          echo "home: $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "::warning::Homepage returned $HTTP — may be transient pm2 restart window; check manually"
          fi
          TOTAL=$(curl -s https://tradeupbot.app/api/global-stats | python3 -c "import json,sys; print(int(json.load(sys.stdin).get('total_trade_ups') or 0))")
          echo "global-stats total_trade_ups=$TOTAL"
          if [ "$TOTAL" -gt 0 ] && ! grep -q 'preview-stats' /tmp/home.html; then
            echo "::error::Homepage first HTML missing .preview-stats while /api/global-stats has live counts (nginx static prerender was not materialized)"
            exit 1
          fi
          if grep -q '<b>0</b>' /tmp/home.html; then
            echo "::error::Homepage first HTML still has baked zeros"
            exit 1
          fi

      - name: Googlebot SEO smoke check
        run: npm run verify:seo:public -- --routes=/calculator,/faq,/features,/blog/how-cs2-trade-ups-work/
