name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
    # Stress (concurrency) and integration tests build on tests/integration/setup.ts,
    # which requires the tradeupbot_test PostgreSQL database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tradeupbot
          POSTGRES_PASSWORD: tradeupbot_pg_2026
          POSTGRES_DB: tradeupbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tradeupbot:tradeupbot_pg_2026@localhost:5432/tradeupbot_test
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Determine whether deployment is needed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          deploy=true
          if [[ "$EVENT_NAME" == "push" && -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            # Compare the full push, including every commit and both sides of renames.
            git diff --name-only --no-renames -z "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/deploy-paths"
            deploy=false
            while IFS= read -r -d '' changed_path; do
              if [[ "$changed_path" != "README.md" && "$changed_path" != ".github/workflows/deploy.yml" ]]; then
                deploy=true
                break
              fi
            done < "$RUNNER_TEMP/deploy-paths"
          fi
          printf 'deploy=%s\n' "$deploy" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build (required for unit tests that read dist/)
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Stress / perf budgets
        run: npm run test:stress

  deploy:
    needs: test
    if: needs.test.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Install frontend deps
        run: cd frontend && npm ci
        if: hashFiles('frontend/package-lock.json') != ''

      - name: Build (Vite + prerender)
        env:
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID || 'G-2474G4P5QE' }}
        run: npm run build

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 178.156.239.58 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync dist to VPS
        run: rsync -avz --delete dist/ root@178.156.239.58:/opt/trade-up-bot/dist/

      - name: Git pull main + session secret preflight + pm2 reload api
        run: |
          ssh root@178.156.239.58 "cd /opt/trade-up-bot && git fetch origin main && git merge --ff-only origin/main && npx --no-install tsx scripts/check-production-session-secret.ts && pm2 reload api"

      - name: Proxy /best-cs2-trade-ups to Node
        run: |
          ssh root@178.156.239.58 "cd /opt/trade-up-bot && python3 scripts/patch-nginx-best-route.py --apply"

      - name: Static HTML security headers
        run: |
          ssh root@178.156.239.58 "cd /opt/trade-up-bot && python3 scripts/patch-nginx-security-headers.py --apply"

      - name: Redirect legacy collection slugs
        run: |
          ssh root@178.156.239.58 "cd /opt/trade-up-bot && python3 scripts/patch-nginx-collection-slug.py --apply"

      - name: Smoke check
        run: |
          HTTP=$(curl -s -o /tmp/home.html -w "%{http_code}" https://tradeupbot.app/ || true)
          HTTP=${HTTP:-000}
          echo "home: $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "::warning::Homepage returned $HTTP — may be transient pm2 restart window; check manually"
          fi
          ready=0
          deadline=$((SECONDS + 90))
          while [ "$SECONDS" -lt "$deadline" ]; do
            code="$(curl -sS -o /tmp/global-stats.json -w "%{http_code}" --max-time 15 "https://tradeupbot.app/api/global-stats" || true)"
            if [ "$code" = "200" ] && python3 -c 'import json; json.load(open("/tmp/global-stats.json"))' >/dev/null 2>&1; then
              ready=1
              break
            fi
            echo "global-stats not ready (http=${code:-000})"
            sleep 3
          done
          if [ "$ready" != "1" ]; then
            echo "::error::/api/global-stats did not return HTTP 200 with a JSON body within 90s (last http=${code:-000})"
            echo "----- pm2 jlist -----"
            timeout 30 ssh -o ConnectTimeout=10 -o BatchMode=yes root@178.156.239.58 "pm2 jlist 2>/dev/null | python3 -c 'import json,sys; exec(\"raw=sys.stdin.read()\\ndec=json.JSONDecoder()\\nprocs=None\\ni=raw.find(\\\"[\\\")\\nwhile i>=0:\\n    try:\\n        val,_=dec.raw_decode(raw,i)\\n    except Exception:\\n        i=raw.find(\\\"[\\\", i+1)\\n        continue\\n    if isinstance(val, list):\\n        procs=val\\n        break\\n    i=raw.find(\\\"[\\\", i+1)\\nif not isinstance(procs, list) or not procs:\\n    sys.exit(1)\\nfor p in procs:\\n    if not isinstance(p, dict):\\n        sys.exit(1)\\n    env=p.get(\\\"pm2_env\\\")\\n    if not isinstance(env, dict):\\n        env={}\\n    fields=(p.get(\\\"name\\\"), p.get(\\\"pm_id\\\"), env.get(\\\"status\\\"), env.get(\\\"restart_time\\\"), env.get(\\\"pm_uptime\\\"))\\n    if any(isinstance(v, (dict, list)) for v in fields):\\n        sys.exit(1)\\n    print(\\\"name=%s pm_id=%s status=%s restart_time=%s uptime=%s\\\"%fields)\\n\")' 2>/dev/null" 2>/dev/null || echo "pm2 summary unavailable"
            echo "see pm2 logs api on the VPS"
            exit 1
          fi
          TOTAL=$(python3 -c "import json; print(int(json.load(open('/tmp/global-stats.json')).get('total_trade_ups') or 0))")
          echo "global-stats total_trade_ups=$TOTAL"
          if [ "$TOTAL" -gt 0 ] && ! grep -q 'preview-stats' /tmp/home.html; then
            echo "::error::Homepage first HTML missing .preview-stats while /api/global-stats has live counts (nginx static prerender was not materialized)"
            exit 1
          fi
          if grep -q '<b>0</b>' /tmp/home.html; then
            echo "::error::Homepage first HTML still has baked zeros"
            exit 1
          fi

      - name: Googlebot SEO smoke check
        run: npm run verify:seo:public -- --routes=/calculator,/faq,/features,/blog/how-cs2-trade-ups-work/,/best-cs2-trade-ups,/trade-ups/tiers/covert
